<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque - Farmácia</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

    <!-- TOPO -->
    <header class="topo">
        <div>
            <h1>
                <i class="fa-solid fa-capsules"></i>
                Controle de Estoque
            </h1>
            <p>Organize seus medicamentos de forma simples e prática</p>
        </div>

        <div class="status">
            <div class="card-status">
                <span>Total no estoque</span>
                <strong id="totalCard">0</strong>
            </div>
            <div class="card-status vencido-card">
                <span>Já vencidos</span>
                <strong id="vencidosCard">0</strong>
            </div>
            <div class="card-status proximo-card">
                <span>Vencem em breve</span>
                <strong id="proximosCard">0</strong>
            </div>
        </div>
    </header>

    <!-- FORMULÁRIO -->
    <section class="card">
        <div class="titulo-card">
            <i class="fa-solid fa-plus"></i>
            <h2>Adicionar novo medicamento</h2>
        </div>

        <div class="formulario">
            <div class="campo">
                <label>Nome do medicamento</label>
                <input type="text" id="nome" placeholder="Ex: Dipirona 500mg">
            </div>
            <div class="campo">
                <label>Número do lote</label>
                <input type="text" id="lote" placeholder="Ex: LOT123">
            </div>
            <div class="campo">
                <label>Quantidade em estoque</label>
                <input type="number" id="quantidade" placeholder="Quantas unidades?">
            </div>
            <div class="campo">
                <label>Data de validade</label>
                <input type="date" id="validade">
            </div>
            <div class="campo">
                <label>Preço unitário</label>
                <input type="number" id="preco" placeholder="0,00" step="0.01">
            </div>
            <div class="campo">
                <label>Fornecedor</label>
                <input type="text" id="fornecedor" placeholder="De quem você comprou?">
            </div>
        </div>

        <div class="acoes-formulario">
            <button class="btn-cadastrar" onclick="cadastrar()">
                <i class="fa-solid fa-floppy-disk"></i>
                Salvar medicamento
            </button>
        </div>
    </section>

    <!-- FILTROS -->
    <section class="filtros">
        <button onclick="mostrarTodos()">
            <i class="fa-solid fa-list"></i>
            Ver todos
        </button>
        <button onclick="mostrarVencidos()">
            <i class="fa-solid fa-triangle-exclamation"></i>
            Só os vencidos
        </button>
        <button onclick="mostrarProximos()">
            <i class="fa-solid fa-clock"></i>
            Vencem nos próximos 30 dias
        </button>
    </section>

    <!-- TABELA -->
    <section class="card tabela-card">
        <div class="titulo-card">
            <i class="fa-solid fa-boxes-stacked"></i>
            <h2>Medicamentos no estoque</h2>
        </div>

        <div class="tabela-container">
            <table>
                <thead>
                <tr>
                    <th>Medicamento</th>
                    <th>Lote</th>
                    <th>Quantidade</th>
                    <th>Validade</th>
                    <th>Preço</th>
                    <th>Fornecedor</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody id="tabelaMedicamentos"></tbody>
            </table>
        </div>
    </section>

    <div id="info"></div>
</div>

<script src="script.js"></script>
</body>
</html>
